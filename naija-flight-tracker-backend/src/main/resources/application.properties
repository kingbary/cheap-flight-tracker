spring.application.name=backend

# --- Database ---
# The "naija_flight_tracker" schema must exist before you start the app (see setup notes).
spring.datasource.url=jdbc:mysql://localhost:3306/naija_flight_tracker
spring.datasource.username=springstudent
# Password is deliberately NOT set here. Spring Boot automatically reads the
# SPRING_DATASOURCE_PASSWORD environment variable and maps it to this property,
# so it never has to be written into a file that gets committed to git.
# export SPRING_DATASOURCE_PASSWORD='your_password' before running the app.

# --- JPA / Hibernate ---
# "update": Hibernate creates/alters tables to match our @Entity classes automatically.
# Handy while learning; a real project would use versioned migrations instead (e.g. Flyway).
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.properties.hibernate.format_sql=true
